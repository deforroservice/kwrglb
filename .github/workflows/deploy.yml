name: Build site for cPanel

# On every push to main: build the Astro site, upload it to kwarg.co over FTP
# (public_html on the Namecheap cPanel host), and keep a copy of the build on
# the `deploy` branch as a backup for cPanel's Git Version Control.
# FTP login: repository secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Add cPanel deploy instructions
        run: |
          cat > dist/.cpanel.yml <<'EOF'
          ---
          deployment:
            tasks:
              - export DEPLOYPATH=/home/kwarlqvu/public_html/
              - /bin/cp -R * $DEPLOYPATH
          EOF

      - name: Upload to kwarg.co (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .cpanel.yml

      - name: Push built site to deploy branch
        run: |
          cd dist
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy
