name: Build site for cPanel

# On every push to main: build the Astro site and put the finished files
# on the `deploy` branch. cPanel (Git Version Control) pulls that branch
# and copies it into public_html using .cpanel.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Add cPanel deploy instructions
        run: |
          cat > dist/.cpanel.yml <<'EOF'
          ---
          deployment:
            tasks:
              - export DEPLOYPATH=/home/kwarlqvu/public_html/
              - /bin/cp -R * $DEPLOYPATH
          EOF

      - name: Push built site to deploy branch
        run: |
          cd dist
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy
